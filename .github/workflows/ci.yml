name: Python, skills and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill structure
        run: python scripts/check_skills.py
      - name: Run unit and fixture checks
        run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and dependencies
        run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chromium --with-deps
      - name: Run browser journey
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --directory dist --bind 127.0.0.1 > /tmp/makora-http.log 2>&1 &
          server_pid=$!
          cleanup() {
            npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=makora-ci close || true
            kill "$server_pid" || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=makora-ci open http://127.0.0.1:8000/
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=makora-ci run-code --filename tests/browser-flow.js
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=makora-ci run-code --filename tests/handoff-wait.js
