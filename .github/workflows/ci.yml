name: Python, skills and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Validate skill structure
        run: python scripts/check_skills.py
      - name: Run unit and fixture checks
        run: python -m unittest discover -s tests -v
      - name: Check saved project restoration
        run: node tests/test_project_restore.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser journeys
        shell: bash
        run: |
          set -euo pipefail
          python -m makora_core.server --static dist --workspace "$RUNNER_TEMP/makora-workspace" --project-root "$RUNNER_TEMP/makora-project" --host 127.0.0.1 --port 8000 > output-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          node scripts/run_browser_checks.mjs
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            output/browser/
            output-server.log
